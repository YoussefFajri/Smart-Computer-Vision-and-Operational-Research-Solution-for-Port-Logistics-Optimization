name: Build and Push Docker Images to GHCR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Repository Name in Lowercase
        id: repo
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./container_ai_project
          file: ./container_ai_project/docker/Dockerfile.backend
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/backend:latest
            ghcr.io/${{ env.REPO_LOWER }}/backend:${{ github.sha }}

      - name: Build and Push Dashboard Image
        uses: docker/build-push-action@v5
        with:
          context: ./container_ai_project
          file: ./container_ai_project/docker/Dockerfile.dashboard
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/dashboard:latest
            ghcr.io/${{ env.REPO_LOWER }}/dashboard:${{ github.sha }}
